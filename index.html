<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Utah Marketing Agency Finder</title>
<style>
:root{--bg:#fff;--fg:#14202b;--mute:#5b6b78;--line:#e3e8ec;--acc:#0b6e8a}
@media(prefers-color-scheme:dark){:root{--bg:#0f1519;--fg:#e8eef2;--mute:#9aabb8;--line:#25323b;--acc:#4cc3e0}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,sans-serif;padding:24px 16px}
main{max-width:960px;margin:0 auto}h1{font-size:clamp(22px,5vw,30px);margin:0 0 4px}p{color:var(--mute);margin:0 0 16px}
a{color:var(--acc)}.f{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
select,input{font:inherit;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);min-height:44px;flex:1 1 180px}
.n{color:var(--mute);font-size:13px;margin-bottom:8px}.card{border-top:1px solid var(--line);padding:12px 0}
.card b{font-size:16px}.m{color:var(--mute);font-size:13px}.t{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.t span{font-size:12px;border:1px solid var(--line);border-radius:99px;padding:2px 8px}
</style></head><body><main>
<h1>Utah Marketing Agency Finder</h1>
<p>309 marketing agencies with a Utah office, from the <a href="https://thebrandcaptain.com/directory/" target="_blank" rel="noopener">Utah marketing agency directory</a> by Brand Captain. Data last checked 2026-10-29, CC BY 4.0.</p>
<div class="f"><input id="q" placeholder="Search by name"><select id="c"><option value="">All cities</option></select><select id="s"><option value="">All services</option></select></div>
<div class="n" id="n"></div><div id="list"></div></main>
<script>
const $=id=>document.getElementById(id);let rows=[];
fetch('utah_marketing_agencies.json').then(r=>r.json()).then(d=>{rows=d;
 [...new Set(d.map(r=>r.city))].sort().forEach(c=>$('c').add(new Option(c,c)));
 [...new Set(d.flatMap(r=>r.services?r.services.split('; '):[]))].sort().forEach(s=>$('s').add(new Option(s,s)));draw()});
function esc(s){return String(s).replace(/[&<>"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]))}
function draw(){const q=$('q').value.toLowerCase(),c=$('c').value,s=$('s').value;
 const out=rows.filter(r=>(!q||r.name.toLowerCase().includes(q))&&(!c||r.city===c)&&(!s||(r.services||'').split('; ').includes(s)));
 $('n').textContent=out.length+' agencies';
 $('list').innerHTML=out.map(r=>`<div class="card"><b><a href="${esc(r.website)}" target="_blank" rel="noopener nofollow">${esc(r.name)}</a></b>
 <div class="m">${esc(r.city)}, UT${r.founded?' · founded '+esc(r.founded):''}${r.team_size?' · '+esc(r.team_size)+' staff':''}${r.hourly_rate?' · '+esc(r.hourly_rate):''} · <a href="${esc(r.directory_page)}" target="_blank" rel="noopener">city page</a></div>
 <div class="t">${(r.services||'').split('; ').filter(Boolean).map(x=>'<span>'+esc(x)+'</span>').join('')}</div></div>`).join('')}
['q','c','s'].forEach(id=>$(id).addEventListener('input',draw));
</script></body></html>
